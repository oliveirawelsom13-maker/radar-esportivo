name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias do sistema e Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache git libffi-dev libssl-dev build-essential \
            python3-dev libltdl-dev libffi-dev libssl-dev zip unzip openjdk-17-jdk
          pip install --upgrade pip setuptools buildozer cython

      - name: Compilar APK com Buildozer
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          command: buildozer android debug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-apk
          path: bin/*.apk
